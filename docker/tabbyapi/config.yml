# TabbyAPI config for Qwen3.8-Flash-Next EXL3 (3.05bpw) on one DGX Spark.
# Baked into the image as /app/config.yml; mount your own over it to change it.
# Mirrors scripts/exl3_native/tuning/run-qwen38-exl3.sh:
#   -mtp -ndt 5 -dds -dc 0.6 -cq 8,8 -cs 262144
# (-dc comes from EXL3_DRAFT_CONFIDENCE in the image, taskset from start_tabby.sh.)
#
# Start and stop with ./start_tabby.sh and ./stop_tabby.sh in the repo root
# (docker/tabbyapi/README.md).

network:
  # Published with -p 5000:5000, so reachable from the whole network.
  host: 0.0.0.0
  port: 5000
  # No API key: anyone who can reach port 5000 can use the API, including the
  # admin endpoints (load/unload model). Fine on a trusted internal network.
  disable_auth: true

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false

model:
  model_dir: /models
  model_name: Qwen3.8-Flash-Next-EXL3
  backend: exllamav3
  # The trained window and the measured ceiling (see the README's context section).
  max_seq_len: 262144
  # Room for three full-length conversations at once (pi runs up to three sessions);
  # 8-bit KV is ~12 KB/token, so each extra 262,144 tokens is ~3 GiB.
  cache_size: 786432
  # 8-bit KV: faster at every depth on this geometry, acceptance unchanged.
  cache_mode: 8,8
  # Prefill chunk. The expert weights are dequantized once per chunk, so larger
  # chunks prefill faster: 20k cold prompt 42.8 s at 2048, 31.7 s at 4096,
  # 26.7 s at 8192 (TabbyAPI's default is 2048).
  chunk_size: 8192
  # Images via image_url content parts. The pack ships preprocessor_config.json,
  # which is what makes exllamav3 load the vision tower.
  vision: true

draft_model:
  # The model's own MTP head; no separate draft model.
  draft_mode: mtp
  # chat.py -cq applies to the draft cache too.
  draft_cache_mode: 8,8
  draft_num_tokens: 5
  dynamic_draft: true

memory:
  # Budget for recurrent-state checkpoints (MB), which let a follow-up turn resume
  # from its cached prefix. One checkpoint is ~112 MiB (36 GatedDeltaNet layers);
  # a long prompt leaves ~10-15 of them, so the default 4096 holds about one and a
  # half full-length conversations and three would evict each other's.
  sysmem_recurrent_cache: 8192

sampling:
  # Fallback sampling for requests that omit it: the model's generation_config.json
  # (sampler_overrides/qwen38.yml). Values a request sets are kept.
  override_preset: qwen38
